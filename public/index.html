<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMPT</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">TEMPT</a>
  <nav id="brands"></nav>
  <button id="open-cart">Корзина (<span id="cart-count">0</span>)</button>
</header>

<main class="grid" id="grid"></main>

<div class="overlay" id="overlay"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" data-close>Закрыть</button>
    <div class="gallery" id="gallery"></div>
    <div class="info">
      <div>
        <div class="mute" id="p-brand"></div>
        <div id="p-name"></div>
        <div class="mute" id="p-price"></div>
      </div>
      <div class="sizes" id="sizes"></div>
      <button class="btn" id="add"></button>
      <p class="desc" id="p-desc"></p>
    </div>
  </div>
</div>

<aside class="drawer" id="cart">
  <div class="drawer-head"><span id="cart-title">Корзина</span><button data-close>Закрыть</button></div>

  <div class="drawer-body" id="view-cart"><div id="lines"></div></div>
  <div class="drawer-foot" id="foot-cart">
    <div class="total"><span>Итого</span><span id="total"></span></div>
    <button class="btn" id="to-checkout">Оформить заказ</button>
  </div>

  <form class="drawer-body form" id="checkout" hidden>
    <label>ФИО<input name="name" required minlength="3" maxlength="150" autocomplete="name"></label>
    <label>Telegram ник<input name="tg" required placeholder="@username" pattern="@?[A-Za-z0-9_]{5,32}" autocomplete="off"></label>
    <p class="note">Не меняйте ник до получения заказа — по нему мы свяжемся с вами.</p>
    <label>Телефон<input name="phone" type="tel" required placeholder="+7 900 000-00-00" autocomplete="tel"></label>
    <div>
      <div class="mute" style="margin-bottom:6px">Пункт выдачи</div>
      <div class="seg">
        <label><input type="radio" name="service" value="ozon" required><span>Ozon</span></label>
        <label><input type="radio" name="service" value="yandex"><span>Яндекс</span></label>
        <label><input type="radio" name="service" value="cdek"><span>СДЭК</span></label>
      </div>
    </div>
    <label>Точный адрес пункта выдачи<textarea name="address" rows="3" required minlength="5" maxlength="300" placeholder="Город, улица, дом"></textarea></label>
    <p class="err" id="err"></p>
    <div class="total"><span>Итого</span><span id="total2"></span></div>
    <button class="btn" id="submit">Отправить заказ</button>
    <button class="btn ghost" type="button" id="back">Назад</button>
  </form>

  <div class="drawer-body" id="done" hidden>
    <p>Заказ <span id="order-id"></span> принят.</p>
    <p class="mute" style="margin-top:12px">Мы свяжемся с вами в Telegram.</p>
  </div>
</aside>

<script src="/app.js"></script>
</body>
</html>
